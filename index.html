<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three.js Demos</title>
<meta name="description" content="three.js Demos: sieben Wege, eine flache Architekturzeichnung in ein 3D-Scroll-Erlebnis zu verwandeln, in reinem three.js.">
<link rel="preload" href="fonts/BBHBogle-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Arimo-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Brand: forest green, lime and paper; BBH Bogle for headlines, Arimo for everything that is read */
  @font-face { font-family: 'BBH Bogle'; src: url('fonts/BBHBogle-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Arimo'; src: url('fonts/Arimo-VariableFont_wght.ttf') format('truetype'); font-weight: 400 700; font-style: normal; font-display: swap; }
  :root {
    --bg: #0b1a12;
    --panel: #10241a;
    --card: #142d20;
    --paper: #f1f0e6;
    --ink: #f1f0e6;
    --mute: #a3b3a2;
    --soft: #d3dacb;
    --line: rgba(241, 240, 230, 0.16);
    --line-strong: rgba(241, 240, 230, 0.34);
    --accent: #c4f03e;      /* lime: the accent on dark */
    --accent-ink: #10241a;  /* text on lime */
    --leaf: #3d7607;        /* the accent on paper */
    --display: 'BBH Bogle', 'Arimo', 'Arial Black', sans-serif;
    --sans: 'Arimo', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Arimo', 'Helvetica Neue', Arial, sans-serif;
    --bar-h: 44px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    font-synthesis: none;
  }

  /* ── TOP CAD SWITCHER BAR ── */
  #master-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--bar-h);
    background: var(--panel);
    border-bottom: 1px solid var(--line-strong);
    display: flex;
    align-items: center;
    z-index: 1000;
    user-select: none;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }

  body.bar-collapsed #master-bar {
    transform: translateY(-100%);
  }

  .brand-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 100%;
    padding: 0 14px;
    border-right: 1px solid var(--line);
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    color: var(--ink);
    background: transparent;
    border-top: 0;
    border-bottom: 0;
    border-left: 0;
  }
  .brand-cell:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  .brand-cell .dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    display: inline-block;
  }

  /* 01..07 Number Strip */
  .num-strip {
    display: flex;
    align-items: stretch;
    height: 100%;
    border-right: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .num-strip::-webkit-scrollbar { display: none; }

  .demo-btn {
    appearance: none;
    border: 0;
    border-right: 1px solid var(--line);
    background: transparent;
    color: var(--mute);
    padding: 0 11px;
    height: 100%;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 500 11px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
    position: relative;
  }
  .demo-btn:last-child { border-right: 0; }
  .demo-btn .n {
    font-weight: 600;
    color: var(--ink);
    opacity: 0.75;
  }
  .demo-btn .lbl {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.01em;
    display: none;
  }
  @media (min-width: 1440px) {
    .demo-btn .lbl { display: inline; }
  }
  .demo-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
  }
  .demo-btn.active {
    background: var(--paper);
    color: var(--accent-ink);
  }
  .demo-btn.active .n {
    color: var(--leaf);
    opacity: 1;
  }
  .demo-btn.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2.5px;
    background: var(--leaf);
  }

  /* Active Demo Title + Sub-variants */
  .active-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    height: 100%;
    min-width: 0;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .active-meta::-webkit-scrollbar { display: none; }

  .active-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
  }
  .active-title .code {
    font: 600 10px/1 var(--mono);
    color: var(--accent);
    letter-spacing: 0.1em;
  }
  .active-title .name {
    font: 400 13px/1 var(--display);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .variant-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 6px;
    padding-left: 10px;
    border-left: 1px solid var(--line);
  }
  .var-pill {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: rgba(255, 255, 255, 0.03);
    color: var(--mute);
    font: 500 10px/1 var(--mono);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 5px 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s;
  }
  .var-pill:hover {
    color: var(--ink);
    border-color: var(--ink);
  }
  .var-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  /* Right Controls */
  .bar-actions {
    display: flex;
    align-items: stretch;
    height: 100%;
    margin-left: auto;
    border-left: 1px solid var(--line);
  }
  .act-btn {
    appearance: none;
    border: 0;
    border-right: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 0 12px;
    font: 500 10.5px/1 var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    text-decoration: none;
  }
  .act-btn:last-child { border-right: 0; }
  .act-btn:hover {
    background: rgba(255, 255, 255, 0.08);
  }
  .act-btn.on {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  /* Floating tab when bar is hidden */
  #show-bar-tab {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translate(-50%, -100%);
    z-index: 1001;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-top: 0;
    padding: 5px 12px;
    font: 600 10px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  body.bar-collapsed #show-bar-tab {
    transform: translate(-50%, 0);
  }

  /* ── STAGE IFRAME ── */
  #stage-wrap {
    position: fixed;
    top: var(--bar-h);
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--paper);
    transition: top 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  body.bar-collapsed #stage-wrap {
    top: 0;
  }

  #stage {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: var(--paper);
  }

  /* ── ALL-07 SHEET DRAWER / MATRIX OVERLAY ── */
  #matrix-drawer {
    position: fixed;
    top: var(--bar-h);
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(11, 26, 18, 0.96);
    backdrop-filter: blur(10px);
    z-index: 950;
    overflow-y: auto;
    padding: 28px 32px 48px;
    display: none;
  }
  #matrix-drawer.open {
    display: block;
  }

  .matrix-head {
    max-width: 1360px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 14px;
  }
  .matrix-head h2 {
    margin: 0;
    font: 400 24px/1.1 var(--display);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .matrix-head p {
    margin: 6px 0 0;
    font: 400 12px/1.4 var(--mono);
    color: var(--mute);
  }

  .matrix-grid {
    max-width: 1360px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 14px;
  }

  .sheet-card {
    background: var(--card);
    border: 1px solid var(--line-strong);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.14s, transform 0.14s;
    position: relative;
  }
  .sheet-card:hover {
    border-color: var(--ink);
  }
  .sheet-card.active {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .sheet-card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font: 600 11px/1 var(--mono);
    color: var(--mute);
    letter-spacing: 0.1em;
  }
  .sheet-card-top .num {
    color: var(--accent);
    font-size: 12px;
  }

  .sheet-card h3 {
    margin: 0;
    font: 400 19px/1.15 var(--display);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
  }
  .sheet-card h3:hover {
    color: var(--accent);
  }

  .sheet-card p {
    margin: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--soft);
    flex: 1;
  }

  .sheet-vars {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }

  @media (max-width: 900px) {
    .active-meta { display: none; }
    #matrix-drawer { padding: 18px 16px 36px; }
  }
</style>
</head>
<body>

<header id="master-bar">
  <button class="brand-cell" id="toggle-matrix" title="Alle sieben Techniken zeigen">
    <span class="dot"></span>
    <span>THREE.JS // 07</span>
    <span style="color:var(--mute)">[ÜBERSICHT]</span>
  </button>

  <nav class="num-strip" id="num-strip" aria-label="Techniken 01 bis 07"></nav>

  <div class="active-meta">
    <div class="active-title">
      <span class="code" id="cur-code">PURLIN // AXO-01</span>
      <span class="name" id="cur-name">three.js Demo 1</span>
    </div>
    <div class="variant-group" id="cur-variants"></div>
  </div>

  <div class="bar-actions">
    <button class="act-btn" id="prev-btn" title="Vorherige Demo">←</button>
    <button class="act-btn" id="next-btn" title="Nächste Demo">→</button>
    <a class="act-btn" id="open-new" href="#" target="_blank" rel="noopener" title="Aktuelle Demo in einem eigenen Tab öffnen">ÖFFNEN ↗</a>
    <button class="act-btn" id="hide-bar-btn" title="Leiste einklappen für die Vollbildansicht">▴ LEISTE</button>
  </div>
</header>

<button id="show-bar-tab" title="Leiste anzeigen">▾ THREE.JS // 07</button>

<div id="matrix-drawer">
  <div class="matrix-head">
    <div>
      <h2>THREE.JS // SIEBEN TECHNIKEN [01 BIS 07]</h2>
      <p>Wählen Sie eine Technik oder eine ihrer Varianten. Jede läuft live in Ihrem Browser. Am besten auf einem Laptop.</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="act-btn on" id="close-matrix" style="padding:8px 14px;">SCHLIESSEN ✕</button>
    </div>
  </div>
  <div class="matrix-grid" id="matrix-grid"></div>
</div>

<main id="stage-wrap">
  <iframe id="stage" title="Aktive 3D-Architekturdemo" allow="fullscreen"></iframe>
</main>

<script>
const DEMOS = [
  {
    "id": "01",
    "code": "PURLIN // AXO-01",
    "title": "three.js Demo 1",
    "short": "Explosionsaxo",
    "desc": "Eine Explosionsaxonometrie setzt sich Schicht für Schicht in Bauabfolge zusammen. Dann weitet sich das Objektiv auf Augenhöhe, und Sie gehen hinein.",
    "variants": [
      {
        "label": "A · Planblatt",
        "url": "../threejs-demo-1/index.html?dir=a"
      },
      {
        "label": "B · Abwicklung",
        "url": "../threejs-demo-1/index.html?dir=b"
      },
      {
        "label": "C · Geschossweise",
        "url": "../threejs-demo-1/index.html?dir=c"
      }
    ]
  },
  {
    "id": "02",
    "code": "COTA // SWP-02",
    "title": "three.js Demo 2",
    "short": "Schnitt-Scan",
    "desc": "Eine Schnittzeichnung öffnet sich in die Tiefe. Ein Scan macht aus Tusche Material und aus den gezeichneten Sonnenwinkeln echte Sonnenstrahlen. Dann gehen Sie durch den Schnitt hinein.",
    "variants": [
      {
        "label": "Demo",
        "url": "../threejs-demo-2/index.html"
      }
    ]
  },
  {
    "id": "03",
    "code": "POCHÉ // SEC-03",
    "title": "three.js Demo 3",
    "short": "Offener Schnitt",
    "desc": "Ein flacher Schnitt zeichnet sich selbst. Dann öffnet sich das Objektiv, während der Schnitt seine Größe behält, und die Kamera besucht jede Ebene vom Schnitt aus.",
    "variants": [
      {
        "label": "A · Objektiv öffnen",
        "url": "../threejs-demo-3/index.html?dir=a"
      },
      {
        "label": "C · Die Treppe hinab",
        "url": "../threejs-demo-3/index.html?dir=c"
      }
    ]
  },
  {
    "id": "04",
    "code": "PROJEKT STEININGER // A-901",
    "title": "three.js Demo 4",
    "short": "Bau-Zeitraffer",
    "desc": "Sechs Zeichnungen von Projekt Steininger, Phase für Phase. Tauchen Sie in die erste ein, sehen Sie die Baustelle aus Scanlinien entstehen und gehen Sie durch drei Geschosse, die sich Woche für Woche einrichten, bis zur Übergabe am Pool.",
    "variants": [
      {
        "label": "Demo",
        "url": "../threejs-demo-4/index.html"
      }
    ]
  },
  {
    "id": "05",
    "code": "PROJEKT STEININGER // A-905",
    "title": "three.js Demo 5",
    "short": "Bauzeitenplan",
    "desc": "Der Bauzeitenplan von Projekt Steininger. Scrollen Sie durch 38 Wochen, und das Travertinhaus am Hang baut sich Balken für Balken selbst, samt Turmdrehkran. Dann öffnet sich die Tür zum Hof, und Sie gehen hinein bis an den Pool.",
    "variants": [
      {
        "label": "A · Bauzeitenplan",
        "url": "../threejs-demo-5/index.html?dir=a"
      },
      {
        "label": "B · Plan 1:1",
        "url": "../threejs-demo-5/index.html?dir=b"
      },
      {
        "label": "C · Baustellenkamera",
        "url": "../threejs-demo-5/index.html?dir=c"
      }
    ]
  },
  {
    "id": "06",
    "code": "ATELIER 1:100 // MDL-06",
    "title": "three.js Demo 6",
    "short": "Kartonmodell",
    "desc": "Ein weißes Kartonmodell nachts auf dem Schreibtisch. Tauchen Sie hinab zur Maßstabsfigur, und der Karton wird zum echten Haus, mit der Schreibtischlampe als Sonne.",
    "variants": [
      {
        "label": "Demo",
        "url": "../threejs-demo-6/index.html"
      }
    ]
  },
  {
    "id": "07",
    "code": "ALBION ROW // ELV-07",
    "title": "three.js Demo 7",
    "short": "Sonnige Ansicht",
    "desc": "Eine Vorderansicht, deren Schraffur der echte Schatten ist. Ein Scan verwandelt sie in Backstein, die Sonne wandert, die Tür öffnet sich, und Sie gehen hinein.",
    "variants": [
      {
        "label": "A · Eine Tür",
        "url": "../threejs-demo-7/a-one-door/index.html"
      },
      {
        "label": "B · Die Reihe",
        "url": "../threejs-demo-7/b-the-row/index.html"
      },
      {
        "label": "C · Die Fassade",
        "url": "../threejs-demo-7/c-the-face/index.html"
      }
    ]
  }
];

const numStrip = document.getElementById('num-strip');
const curCode = document.getElementById('cur-code');
const curName = document.getElementById('cur-name');
const curVariants = document.getElementById('cur-variants');
const openNew = document.getElementById('open-new');
const stage = document.getElementById('stage');
const matrixDrawer = document.getElementById('matrix-drawer');
const matrixGrid = document.getElementById('matrix-grid');
const toggleMatrixBtn = document.getElementById('toggle-matrix');

let activeIdx = 0;
let activeVarIdx = 0;
let loadToken = 0;

// Build top strip buttons
DEMOS.forEach((d, idx) => {
  const btn = document.createElement('button');
  btn.className = 'demo-btn';
  btn.dataset.idx = idx;
  btn.title = `${d.id} · ${d.title}`;
  btn.innerHTML = `<span class="n">${d.id}</span><span class="lbl">${d.short}</span>`;
  btn.addEventListener('click', () => selectDemo(idx, 0));
  numStrip.appendChild(btn);
});

// Build matrix grid cards
DEMOS.forEach((d, idx) => {
  const card = document.createElement('div');
  card.className = 'sheet-card';
  card.dataset.idx = idx;

  const top = document.createElement('div');
  top.className = 'sheet-card-top';
  top.innerHTML = `<span class="num">BLATT ${d.id}</span><span>${d.code}</span>`;

  const h3 = document.createElement('h3');
  h3.textContent = `${d.id} · ${d.title}`;
  h3.addEventListener('click', () => {
    selectDemo(idx, 0);
    setMatrixOpen(false);
  });

  const p = document.createElement('p');
  p.textContent = d.desc;

  const vars = document.createElement('div');
  vars.className = 'sheet-vars';
  d.variants.forEach((v, vIdx) => {
    const vp = document.createElement('button');
    vp.className = 'var-pill';
    vp.dataset.idx = idx;
    vp.dataset.vidx = vIdx;
    vp.textContent = v.label;
    vp.addEventListener('click', () => {
      selectDemo(idx, vIdx);
      setMatrixOpen(false);
    });
    vars.appendChild(vp);
  });

  card.append(top, h3, p, vars);
  matrixGrid.appendChild(card);
});

function setMatrixOpen(open) {
  matrixDrawer.classList.toggle('open', open);
  toggleMatrixBtn.classList.toggle('on', open);
}

toggleMatrixBtn.addEventListener('click', () => {
  setMatrixOpen(!matrixDrawer.classList.contains('open'));
});
document.getElementById('close-matrix').addEventListener('click', () => setMatrixOpen(false));

function selectDemo(idx, vIdx = 0, pushHash = true) {
  const encodedUrl = markActive(idx, vIdx, pushHash);
  // Release previous WebGL context cleanly before loading next Three.js scene
  const token = ++loadToken;
  stage.src = 'about:blank';
  setTimeout(() => {
    if (token !== loadToken) return;
    stage.src = encodedUrl;
  }, 30);
}

// the bar, the drawer and the hash for one demo and variant, without reloading the stage
function markActive(idx, vIdx = 0, pushHash = true) {
  activeIdx = (idx + DEMOS.length) % DEMOS.length;
  const demo = DEMOS[activeIdx];
  activeVarIdx = Math.max(0, Math.min(vIdx, demo.variants.length - 1));
  const variant = demo.variants[activeVarIdx];
  const encodedUrl = encodeURI(variant.url);

  // Update top buttons
  document.querySelectorAll('.demo-btn').forEach((b, i) => {
    b.classList.toggle('active', i === activeIdx);
  });

  // Update active title + variant pills
  curCode.textContent = demo.code;
  curName.textContent = demo.title;
  curVariants.innerHTML = '';
  demo.variants.forEach((v, i) => {
    const pill = document.createElement('button');
    pill.className = 'var-pill' + (i === activeVarIdx ? ' active' : '');
    pill.textContent = v.label;
    pill.addEventListener('click', () => selectDemo(activeIdx, i));
    curVariants.appendChild(pill);
  });

  // Update matrix cards
  document.querySelectorAll('.sheet-card').forEach((c, i) => {
    c.classList.toggle('active', i === activeIdx);
  });
  document.querySelectorAll('.sheet-vars .var-pill').forEach(p => {
    const match = Number(p.dataset.idx) === activeIdx && Number(p.dataset.vidx) === activeVarIdx;
    p.classList.toggle('active', match);
  });

  openNew.href = encodedUrl;

  if (pushHash) {
    const hash = activeVarIdx > 0 ? `#${demo.id}:${activeVarIdx}` : `#${demo.id}`;
    history.replaceState(null, '', hash);
  }
  return encodedUrl;
}

// the demos hand over to each other by themselves (one continuous show): the bar follows along
function followStage() {
  try {
    const L = stage.contentWindow.location;
    if (!/threejs-demo-\d/.test(L.pathname)) return;
    const path = L.pathname.replace(/index\.html$/, ''), dir = new URLSearchParams(L.search).get('dir');
    let hit = null;
    DEMOS.forEach((d, i) => d.variants.forEach((v, j) => {
      const u = new URL(v.url, location.href), vd = u.searchParams.get('dir');
      if (u.pathname.replace(/index\.html$/, '') === path && (!vd || !dir || vd === dir) && !hit) hit = [i, j];
    }));
    if (hit && (hit[0] !== activeIdx || hit[1] !== activeVarIdx)) markActive(hit[0], hit[1]);
  } catch {}
}
stage.addEventListener('load', () => {
  try { stage.contentWindow.focus(); } catch {}
  followStage();
});

document.getElementById('prev-btn').addEventListener('click', () => selectDemo(activeIdx - 1, 0));
document.getElementById('next-btn').addEventListener('click', () => selectDemo(activeIdx + 1, 0));

document.getElementById('hide-bar-btn').addEventListener('click', () => {
  document.body.classList.add('bar-collapsed');
});
document.getElementById('show-bar-tab').addEventListener('click', () => {
  document.body.classList.remove('bar-collapsed');
});

function parseHash() {
  const raw = location.hash.replace(/^#/, '').trim();
  if (!raw) return { idx: 0, vIdx: 0 };
  const [idPart, vPart] = raw.split(':');
  const foundIdx = DEMOS.findIndex(d => d.id === idPart.padStart(2, '0'));
  return {
    idx: foundIdx >= 0 ? foundIdx : 0,
    vIdx: vPart ? parseInt(vPart, 10) || 0 : 0
  };
}

window.addEventListener('hashchange', () => {
  const { idx, vIdx } = parseHash();
  selectDemo(idx, vIdx, false);
});

// Initialize on 01 (or URL hash if present)
const init = location.hash ? parseHash() : { idx: 0, vIdx: 0 };
selectDemo(init.idx, init.vIdx, false);
</script>
